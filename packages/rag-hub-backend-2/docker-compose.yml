# rag-hub-backend-2 专属中间件（依赖公共栈 nest-lab-net）
# 先：pnpm infra:up（仓库根）
# 再：pnpm --filter rag-hub-backend-2 docker:up

name: rag-hub-backend-2

services:
  # RabbitMQ — 文档发布后异步管线（RAG / KG / ES）
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rag-hub-backend-2-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5

  # Elasticsearch 8.17.0 + IK（官方镜像不含 IK，见 ./elasticsearch/Dockerfile）
  es:
    build: ./elasticsearch
    container_name: rag-hub-backend-2-es
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./volumes/es/data:/usr/share/elasticsearch/data
    restart: always

  # Kibana 须与 ES 主版本一致
  kibana:
    image: kibana:8.17.0
    container_name: rag-hub-backend-2-kibana
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    volumes:
      - ./volumes/kibana:/usr/share/kibana/data
    restart: always
    depends_on:
      - es

networks:
  default:
    name: nest-lab-net
    external: true
