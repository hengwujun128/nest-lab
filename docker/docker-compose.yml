# nest-lab 公共中间件（全仓唯一一套）
# 用法（仓库根目录）：pnpm infra:up / pnpm infra:down
#
# 各 package 应用通过 localhost 连接，勿在 package 内再起同名服务。

name: nest-lab

services:
  # PostgreSQL + pgvector（RAG 向量扩展）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nest-lab-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: knowledge_hub
    ports:
      - '5432:5432'
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./init-scripts/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d knowledge_hub']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nest-lab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ./volumes/pgadmin:/var/lib/pgadmin
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/login']
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - '8088:80'
    depends_on:
      - postgres

  mongodb:
    image: mongo:7-jammy
    container_name: nest-lab-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass123
      MONGO_INITDB_DATABASE: knowledge_hub
    ports:
      - '27017:27017'
    volumes:
      - ./volumes/mongo:/data/db
      - ./init-scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--eval',
          "db.adminCommand('ping')",
          '-u',
          'mongo_user',
          '-p',
          'mongo_pass123',
          '--authenticationDatabase',
          'admin',
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: nest-lab-mongo-express
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo_user
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo_pass123
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_BASICAUTH_ENABLED: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: me_admin
      ME_CONFIG_BASICAUTH_PASSWORD: me_123456
      ME_CONFIG_OPTIONS_EDITORTHEME: '3024-night'
    depends_on:
      mongodb:
        condition: service_healthy

  # RustFS（S3 兼容对象存储）
  # 文档：https://docs.rustfs.com/installation/docker/
  rustfs:
    image: rustfs/rustfs:latest
    container_name: nest-lab-rustfs
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: 'true'
    volumes:
      - ./volumes/rustfs0:/data/rustfs0
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:9000/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  default:
    name: nest-lab-net
